name: CRW CI

on:
  push:
    branches: [dev]
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, edited]

permissions:
  contents: read

concurrency:
  # A title or body edit that keeps the base gets its own group, so it never cancels the
  # run a push started. A retarget stays in the main group and replaces obsolete runs.
  group: workflow-skills-ci-${{ github.event.pull_request.number || github.ref }}${{ github.event.action == 'edited' && !github.event.changes.base && '-edit' || '' }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The large-blob check judges every blob a pull request or a push brings into the history.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The CI checks live in the development binary, which release archives never carry.
      - run: go build -tags dev -o "$RUNNER_TEMP/crw-dev" ./cmd/crw-dev
      # A pull request run judges the commits it adds to its base, a push to dev the commits it adds;
      # a run with neither (a manual dispatch) judges every commit.
      - run: '"$RUNNER_TEMP/crw-dev" ci validate'
        env:
          BLOB_RANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      - run: '"$RUNNER_TEMP/crw-dev" ci plugin'
      - run: '"$RUNNER_TEMP/crw-dev" ci contracts'

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      # A pull request run scans only the commits it adds; any other event scans every ref.
      - run: bash scripts/ci/secrets.sh
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}

  # The staged skills ship Node helper scripts, and their tests travel with them (G5). The job
  # runs only when a staged skill path changed: a change that does not touch them ends the job
  # before any runner setup, and a skipped run counts as success. Node is needed here and when an
  # agent runs a skill script, never on a hook path or in the crw binary.
  skill-scripts-node:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # The staged skills root, named once: the changed-path filter and the test run both read it.
      SKILLS_ROOT: port/cxc/skills
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Decide from the changed files whether the staged skills changed
        id: paths
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # A pull request compares its base with its head, a push to dev the previous commit with
          # this one. A manual dispatch has neither, so it runs the tests.
          if [[ -n "${PR_BASE_SHA}" ]]; then
            base="${PR_BASE_SHA}"; head="${PR_HEAD_SHA}"
          elif [[ -n "${PUSH_BEFORE_SHA}" && "${PUSH_BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]]; then
            base="${PUSH_BEFORE_SHA}"; head="${GITHUB_SHA}"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo 'no base to compare with; the staged skill-script tests run'
            exit 0
          fi
          changed="$(git diff --name-only "${base}" "${head}" -- "${SKILLS_ROOT}")"
          if [[ -n "${changed}" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            printf 'staged skill paths changed:\n%s\n' "${changed}"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo 'no staged skill path changed; the job ends without installing Node'
          fi
      - if: steps.paths.outputs.changed == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # An exact release, not the floating major: the moved tests are timing- and
          # runtime-sensitive, so the same commit must meet the same Node.
          node-version: '24.20.0'
      - name: Run the staged skill-script tests
        if: steps.paths.outputs.changed == 'true'
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=("${SKILLS_ROOT}"/*/tests/*.test.mjs)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo 'no staged skill-script test file'
            exit 0
          fi
          node --test "${files[@]}"

  go-product:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # One runner each: lint; the Go suite as `make test-part` parts, which together are
        # `make test` (the contract corpus included); the static release binaries.
        part: [lint, test-1, test-2, test-3, test-4, test-rest, dist]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Lint
        if: matrix.part == 'lint'
        run: make lint
      - name: Test and replay the contract corpus (${{ matrix.part }})
        if: startsWith(matrix.part, 'test-')
        env:
          PART: ${{ matrix.part }}
        run: make test-part TEST_PART="${PART#test-}"
      - name: Build the static binaries for every published target
        if: matrix.part == 'dist'
        run: |
          for target in linux/amd64 linux/arm64 darwin/arm64; do
            os=${target%/*}
            arch=${target#*/}
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" make dist BINARY="dist/crw_${os}_${arch}/crw"
          done
          (cd dist && sha256sum crw_*/crw > SHA256SUMS && cat SHA256SUMS)
      # IS-1, IS-7 and IS-8: the linux/amd64 binary just built is installed into an isolated
      # home and the plugin's declared wiring runs against it. CGO_ENABLED=0 and -trimpath are
      # the dist build's, so the test reuses its compiled packages and only relinks.
      - name: Install and wire the release binary in an isolated home
        if: matrix.part == 'dist'
        env:
          CGO_ENABLED: '0'
        run: CRW_TEST_BINARY="$PWD/dist/crw_linux_amd64/crw" go test -trimpath -tags integration -count=1 ./internal/runtime/integration/...
      - if: matrix.part == 'dist'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crw_linux_amd64
          path: dist/crw_linux_amd64/crw
          if-no-files-found: error
      - if: matrix.part == 'dist'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crw_linux_arm64
          path: dist/crw_linux_arm64/crw
          if-no-files-found: error
      - if: matrix.part == 'dist'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crw_darwin_arm64
          path: dist/crw_darwin_arm64/crw
          if-no-files-found: error
      - if: matrix.part == 'dist'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SHA256SUMS
          path: dist/SHA256SUMS
          if-no-files-found: error

  # The one required check. It runs after every other job, even a failed or cancelled one, and
  # passes only when every job it needs succeeded. The results are written into a file by the
  # step's own script, never passed in the environment, whose size the runner bounds.
  dev-gate:
    if: always()
    needs: [validate, secrets, skill-scripts-node, go-product]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every prerequisite to succeed
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == pull_request && "$BASE_REF" == main ]]; then
            echo '::error::PRs must target a development branch; main is a release mirror.'
            exit 1
          fi
          results="$RUNNER_TEMP/needs.json"
          cat > "$results" <<'NEEDS'
          ${{ toJSON(needs) }}
          NEEDS
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' "$results" || true
          if ! jq -e 'type == "object" and length > 0 and all(.[]; type == "object" and .result == "success")' "$results" > /dev/null; then
            echo '::error::Every prerequisite job must succeed.'
            exit 1
          fi
          echo 'Every prerequisite job succeeded.'
