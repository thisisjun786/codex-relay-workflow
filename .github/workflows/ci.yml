name: CRW CI

on:
  push:
    branches: [dev]
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, edited, labeled]

permissions:
  contents: read

concurrency:
  # A title or body edit that keeps the base joins the pull request's own group, so it waits
  # behind a running run instead of cancelling it, and a later push cancels it in turn. A
  # retarget and every other event still replace obsolete runs.
  group: workflow-skills-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !(github.event.action == 'edited' && !github.event.changes.base) }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # The mirror reads this repository's runs and jobs with the workflow's own token.
    permissions:
      contents: read
      actions: read
    steps:
      # A body-only edit needs only the mirror script, and the script has to exist before the
      # mirror decides, so it is fetched sparsely first. Every other run skips this step.
      - name: Check out scripts/ci for the body-only edit mirror
        if: ${{ github.event.action == 'edited' && !github.event.changes.base }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: scripts/ci
      # On a body-only edit, a job this head already ran successfully stands down. Every later
      # step of this job carries the answer, so no step is skipped at job level, which GitHub
      # would report as a success and a skipped dev-gate could hide an earlier red run with.
      - name: Mirror the jobs this head already ran
        id: mirror
        if: ${{ github.event.action == 'edited' && !github.event.changes.base }}
        run: bash scripts/ci/edit_mirror.sh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          JOB_NAME: validate
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.mirror.outputs.mirrored != 'true'
        with:
          # The large-blob check judges every blob a pull request or a push brings into the history.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.mirror.outputs.mirrored != 'true'
        with:
          go-version-file: go.mod
      # The CI checks live in the development binary, which release archives never carry.
      - run: go build -tags dev -o "$RUNNER_TEMP/crw-dev" ./cmd/crw-dev
        if: steps.mirror.outputs.mirrored != 'true'
      # A pull request run judges the commits it adds to its base, a push to dev the commits it adds;
      # a run with neither (a manual dispatch) judges every commit.
      - run: '"$RUNNER_TEMP/crw-dev" ci validate'
        env:
          BLOB_RANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        if: steps.mirror.outputs.mirrored != 'true'
      - run: '"$RUNNER_TEMP/crw-dev" ci plugin'
        if: steps.mirror.outputs.mirrored != 'true'
      - run: '"$RUNNER_TEMP/crw-dev" ci contracts'
        if: steps.mirror.outputs.mirrored != 'true'

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out scripts/ci for the body-only edit mirror
        if: ${{ github.event.action == 'edited' && !github.event.changes.base }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: scripts/ci
      - name: Mirror the jobs this head already ran
        id: mirror
        if: ${{ github.event.action == 'edited' && !github.event.changes.base }}
        run: bash scripts/ci/edit_mirror.sh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          JOB_NAME: secrets
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.mirror.outputs.mirrored != 'true'
        with:
          fetch-depth: 0
          persist-credentials: false
      # A pull request run scans only the commits it adds; any other event scans every ref.
      - run: bash scripts/ci/secrets.sh
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        if: steps.mirror.outputs.mirrored != 'true'

  go-product:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    # CRW-790: while the repository variable CRW_CI_MODE is light, a pull request the merge lane
    # has not labeled crw-lane skips the five test legs' work, and the labeled event -- and every
    # later push while the label stays -- runs them in full. One definition, read by the steps
    # below, so lint and dist can never be light and neither can a dev push or a manual dispatch.
    # A skipped job's check still reads success, so a light leg skips its steps and never the job.
    env:
      CRW_LIGHT_LEG: ${{ github.event_name == 'pull_request' && vars.CRW_CI_MODE == 'light' && !contains(github.event.pull_request.labels.*.name, 'crw-lane') && startsWith(matrix.part, 'test-') }}
    strategy:
      fail-fast: false
      matrix:
        # One runner each: lint; the Go suite as `make test-part` parts, which together are
        # `make test` (the contract corpus included); the static release binaries.
        part: [lint, test-1, test-2, test-3, test-4, test-rest, dist]
    steps:
      # A light leg says so in its summary and does none of the leg's work. The condition is a
      # step condition, never a job-level if: GitHub reports a skipped job's check as success, so
      # a skipped leg could hide an earlier red run behind a green dev-gate.
      - name: Light mode notice
        if: env.CRW_LIGHT_LEG == 'true'
        run: |
          printf '%s\n' "light mode: this leg's tests run in full when the merge lane labels the pull request crw-lane" >> "$GITHUB_STEP_SUMMARY"
      - name: Check out scripts/ci for the body-only edit mirror
        if: ${{ github.event.action == 'edited' && !github.event.changes.base && env.CRW_LIGHT_LEG != 'true' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: scripts/ci
      - name: Mirror the jobs this head already ran
        id: mirror
        if: ${{ github.event.action == 'edited' && !github.event.changes.base && env.CRW_LIGHT_LEG != 'true' }}
        run: bash scripts/ci/edit_mirror.sh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          JOB_NAME: go-product (${{ matrix.part }})
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.mirror.outputs.mirrored != 'true' && env.CRW_LIGHT_LEG != 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.mirror.outputs.mirrored != 'true' && env.CRW_LIGHT_LEG != 'true'
        with:
          go-version-file: go.mod
      - name: Lint
        if: matrix.part == 'lint' && steps.mirror.outputs.mirrored != 'true' && env.CRW_LIGHT_LEG != 'true'
        run: make lint
      - name: Test and replay the contract corpus (${{ matrix.part }})
        if: startsWith(matrix.part, 'test-') && steps.mirror.outputs.mirrored != 'true' && env.CRW_LIGHT_LEG != 'true'
        env:
          PART: ${{ matrix.part }}
        run: make test-part TEST_PART="${PART#test-}"
      - name: Build the static binaries for every published target
        if: matrix.part == 'dist' && steps.mirror.outputs.mirrored != 'true' && env.CRW_LIGHT_LEG != 'true'
        run: |
          for target in linux/amd64 linux/arm64 darwin/arm64; do
            os=${target%/*}
            arch=${target#*/}
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" make dist BINARY="dist/crw_${os}_${arch}/crw"
          done
          (cd dist && sha256sum crw_*/crw > SHA256SUMS && cat SHA256SUMS)
      # IS-1, IS-7 and IS-8: the linux/amd64 binary just built is installed into an isolated
      # home and the plugin's declared wiring runs against it. CGO_ENABLED=0 and -trimpath are
      # the dist build's, so the test reuses its compiled packages and only relinks.
      - name: Install and wire the release binary in an isolated home
        if: matrix.part == 'dist' && steps.mirror.outputs.mirrored != 'true' && env.CRW_LIGHT_LEG != 'true'
        env:
          CGO_ENABLED: '0'
        run: CRW_TEST_BINARY="$PWD/dist/crw_linux_amd64/crw" go test -trimpath -tags integration -count=1 ./internal/runtime/integration/...
      - if: matrix.part == 'dist' && steps.mirror.outputs.mirrored != 'true' && env.CRW_LIGHT_LEG != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crw_linux_amd64
          path: dist/crw_linux_amd64/crw
          if-no-files-found: error
      - if: matrix.part == 'dist' && steps.mirror.outputs.mirrored != 'true' && env.CRW_LIGHT_LEG != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crw_linux_arm64
          path: dist/crw_linux_arm64/crw
          if-no-files-found: error
      - if: matrix.part == 'dist' && steps.mirror.outputs.mirrored != 'true' && env.CRW_LIGHT_LEG != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crw_darwin_arm64
          path: dist/crw_darwin_arm64/crw
          if-no-files-found: error
      - if: matrix.part == 'dist' && steps.mirror.outputs.mirrored != 'true' && env.CRW_LIGHT_LEG != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SHA256SUMS
          path: dist/SHA256SUMS
          if-no-files-found: error

  # The one required check. It runs after every other job, even a failed or cancelled one, and
  # passes only when every job it needs succeeded. The results are written into a file by the
  # step's own script, never passed in the environment, whose size the runner bounds.
  dev-gate:
    if: always()
    needs: [validate, secrets, go-product]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every prerequisite to succeed
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == pull_request && "$BASE_REF" == main ]]; then
            echo '::error::PRs must target a development branch; main is a release mirror.'
            exit 1
          fi
          results="$RUNNER_TEMP/needs.json"
          cat > "$results" <<'NEEDS'
          ${{ toJSON(needs) }}
          NEEDS
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' "$results" || true
          if ! jq -e 'type == "object" and length > 0 and all(.[]; type == "object" and .result == "success")' "$results" > /dev/null; then
            echo '::error::Every prerequisite job must succeed.'
            exit 1
          fi
          echo 'Every prerequisite job succeeded.'
