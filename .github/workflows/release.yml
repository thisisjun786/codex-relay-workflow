name: Release

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Exact 40-character commit SHA on dev that this workflow verifies
        required: true
        type: string
      tag:
        description: Release tag, such as v0.1.0 or v0.1.0-rc.1
        required: true
        type: string
      notes:
        description: User-facing release notes
        required: true
        type: string
      dry_run:
        description: Validate only; do not create a tag, release, or update main
        default: true
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  RELEASE_SHA: ${{ inputs.commit }}
  RELEASE_TAG: ${{ inputs.tag }}
  RELEASE_NOTES: ${{ inputs.notes }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - id: release-inputs
        name: Require owner dispatch from dev and valid inputs
        env:
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          [[ "$ACTOR" == "$OWNER" && "$TRIGGERING_ACTOR" == "$OWNER" ]] || {
            echo '::error::Only the repository owner may authorize a release.'
            exit 1
          }
          [[ "$GITHUB_REF" == refs/heads/dev ]] || {
            echo '::error::Run the release workflow from dev.'
            exit 1
          }
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo '::error::Provide an exact 40-character commit SHA.'
            exit 1
          }
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]] || {
            echo '::error::Provide a version tag such as v0.1.0 or v0.1.0-rc.1.'
            exit 1
          }
          [[ "$RELEASE_NOTES" =~ [^[:space:]] ]] || {
            echo '::error::Release notes are required.'
            exit 1
          }
      - name: Checkout release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - id: release-source
        name: Verify source, release ancestry and remote tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin dev main
          git checkout --detach "$RELEASE_SHA"
          [[ "$(git rev-parse HEAD)" == "$RELEASE_SHA" ]]
          git merge-base --is-ancestor "$RELEASE_SHA" origin/dev || {
            echo '::error::The release source must belong to dev.'
            exit 1
          }
          git merge-base --is-ancestor origin/main "$RELEASE_SHA" || {
            echo '::error::The release must fast-forward main; older or divergent sources are not allowed.'
            exit 1
          }
          if tag_body=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG"); then
            tag_sha=$(jq -er '.object.sha' <<< "$tag_body")
            tag_type=$(jq -er '.object.type' <<< "$tag_body")
            if [[ "$tag_type" == tag ]]; then
              peeled=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha") || {
                echo '::error::Could not resolve the annotated release tag.'
                exit 1
              }
              tag_sha=$(jq -er '.object.sha' <<< "$peeled")
              tag_type=$(jq -er '.object.type' <<< "$peeled")
            fi
            [[ "$tag_type" == commit && "$tag_sha" == "$RELEASE_SHA" ]] || {
              echo '::error::This immutable tag already identifies a different commit.'
              exit 1
            }
          else
            status=$(jq -r '.status // empty' <<< "$tag_body")
            [[ "$status" == 404 ]] || {
              echo '::error::Could not determine whether this tag already exists.'
              exit 1
            }
          fi
          {
            printf '## Validated release candidate\n\n'
            printf -- '- Commit: %s\n- Tag: %s\n' "$RELEASE_SHA" "$RELEASE_TAG"
            printf -- '- The selected commit is on dev and fast-forwards main.\n'
            printf -- '- No tag, release, or branch has been changed by validation.\n'
          } >> "$GITHUB_STEP_SUMMARY"
      - id: release-credentials
        name: Require dedicated publication credentials
        if: inputs.dry_run == false
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [[ -z "$RELEASE_TOKEN" ]]; then
            echo '::error::Configure RELEASE_TOKEN before publishing (Contents and Workflows write; Actions read).'
            exit 1
          fi
      - id: release-go-snapshot-tree
        name: Stamp the binaries with the source tree
        run: |
          set -euo pipefail
          # The binaries carry HEAD's tree as their installed revision (decision 34), and only
          # a clean checkout is HEAD's tree.
          [[ -z "$(git status --porcelain)" ]] || {
            echo '::error::The checkout has changes, so the binaries would not be built from its tree.'
            exit 1
          }
          tree=$(git rev-parse 'HEAD^{tree}')
          [[ "$tree" =~ ^[0-9a-f]{40}$ ]] || {
            echo '::error::The checkout names no tree to stamp.'
            exit 1
          }
          echo "SOURCE_TREE=$tree" >> "$GITHUB_ENV"
      - name: Set up the pinned Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - id: release-go-snapshot
        name: Build the static binaries as a snapshot without publishing
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.2
          args: release --snapshot --clean

  # CRW-966: the workflow verifies the SHA it will publish itself, instead of reading a dev push
  # CI run. The repository's local full verification is "crw-dev ci local", which runs every job
  # and step of ci.yml in a clean worktree of the selected commit and writes a
  # verification-record/1 whose "result" is "pass" only when every step succeeded. A failed or
  # absent verification fails this job, and "publish" needs it, so nothing is published from an
  # unverified commit. The job is read-only: it creates no tag, release or branch.
  verify:
    needs: [validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the commit to verify
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up the pinned Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # The screen build and the staged skills' Node tests are two of the verified steps, and the
      # record's pins name Node, so the pinned release is installed here as ci.yml installs it.
      - name: Set up the pinned Node toolchain
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.20.0'
      - id: release-verify-run
        name: Run the local full verification of the selected commit
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$RELEASE_SHA" ]] || {
            echo '::error::The checkout does not identify the commit to verify.'
            exit 1
          }
          record="$RUNNER_TEMP/verification-record.json"
          if ! go run -tags dev ./cmd/crw-dev ci local \
              --commit "$RELEASE_SHA" \
              --runner github-release \
              --record "$record"; then
            echo '::error::The local full verification of this commit failed; nothing is published.'
            exit 1
          fi
      # The record is the evidence, so it is checked on its own: a missing, non-passing, pinned-
      # mismatched or foreign-commit record fails the job and "publish" needs it, so nothing is
      # published from an unverified commit.
      - id: release-verify
        name: Require a passing verification record for this commit
        run: |
          set -euo pipefail
          record="$RUNNER_TEMP/verification-record.json"
          [[ -f "$record" ]] || {
            echo '::error::The verification wrote no record; nothing is published.'
            exit 1
          }
          jq -e '
            .schema == "verification-record/1"
            and .result == "pass"
            and (.pinMismatch | length) == 0
          ' "$record" >/dev/null || {
            echo '::error::The verification record is not a passing verification-record/1 for this commit.'
            exit 1
          }
          jq -e --arg sha "$RELEASE_SHA" '.headCommit == $sha' "$record" >/dev/null || {
            echo '::error::The verification record does not name the commit being released.'
            exit 1
          }
          {
            printf '## Verified release candidate\n\n'
            printf -- '- Commit: %s\n- Tag: %s\n' "$RELEASE_SHA" "$RELEASE_TAG"
            printf -- '- verification-record/1 at %s is a pass for this commit.\n' "$(jq -r '.digest' "$record")"
            printf -- '- No tag, release, or branch has been changed by verification.\n'
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: [validate, verify]
    if: inputs.dry_run == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout the validated commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}
          persist-credentials: true
      - id: release-publish
        name: Publish the source release and fast-forward main
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$GH_TOKEN" ]]; then
            echo '::error::Configure RELEASE_TOKEN before publishing (Contents and Workflows write; Actions read).'
            exit 1
          fi
          git fetch --no-tags origin dev main
          git checkout --detach "$RELEASE_SHA"
          [[ "$(git rev-parse HEAD)" == "$RELEASE_SHA" ]]
          git merge-base --is-ancestor "$RELEASE_SHA" origin/dev || {
            echo '::error::The release source must belong to dev.'
            exit 1
          }
          git merge-base --is-ancestor origin/main "$RELEASE_SHA" || {
            echo '::error::The release must fast-forward main; older or divergent sources are not allowed.'
            exit 1
          }
          if tag_body=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG"); then
            tag_sha=$(jq -er '.object.sha' <<< "$tag_body")
            tag_type=$(jq -er '.object.type' <<< "$tag_body")
            if [[ "$tag_type" == tag ]]; then
              peeled=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha") || {
                echo '::error::Could not resolve the annotated release tag.'
                exit 1
              }
              tag_sha=$(jq -er '.object.sha' <<< "$peeled")
              tag_type=$(jq -er '.object.type' <<< "$peeled")
            fi
            [[ "$tag_type" == commit && "$tag_sha" == "$RELEASE_SHA" ]] || {
              echo '::error::This immutable tag already identifies a different commit.'
              exit 1
            }
            tag_exists=1
          else
            status=$(jq -r '.status // empty' <<< "$tag_body")
            [[ "$status" == 404 ]] || {
              echo '::error::Could not determine whether this tag already exists.'
              exit 1
            }
            tag_exists=0
          fi
          # Tag lookup omits draft releases. Inspect all releases with the owner
          # credential before creating an immutable tag or changing any ref.
          releases=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100") || {
            echo '::error::Could not inspect release conflicts before publication.'
            exit 1
          }
          release=$(jq -c -e -s --arg tag "$RELEASE_TAG" '
            map(if type == "array" then . else error("invalid release page") end)
            | add | map(select(.tag_name == $tag))
            | if length > 1 then error("multiple releases for tag") else {match: .[0]} end
          ' <<< "$releases") || {
            echo '::error::Could not determine whether this release already exists.'
            exit 1
          }
          jq -e --arg sha "$RELEASE_SHA" '
            .match == null or (.match.draft == false and .match.target_commitish == $sha)
          ' <<< "$release" >/dev/null || {
            echo '::error::An existing draft or conflicting release must be resolved before publication.'
            exit 1
          }
          if [[ "$tag_exists" == 0 ]]; then
            if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
              [[ "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" == "$RELEASE_SHA" ]] || {
                echo '::error::The local tag already identifies a different commit.'
                exit 1
              }
            else
              git tag "$RELEASE_TAG" "$RELEASE_SHA"
            fi
            git push origin "refs/tags/$RELEASE_TAG"
          fi
          if jq -e '.match == null' <<< "$release" >/dev/null; then
            args=(--verify-tag --target "$RELEASE_SHA" --title "$RELEASE_TAG" --notes "$RELEASE_NOTES")
            if [[ "$RELEASE_TAG" == *-* ]]; then args+=(--prerelease); fi
            gh release create "$RELEASE_TAG" "${args[@]}" || {
              echo '::error::The tag exists, but release creation failed. Inspect the release and any draft conflict, then recover with the same tag and commit; main was not advanced.'
              exit 1
            }
          fi
          git push origin "$RELEASE_SHA:refs/heads/main" || {
            echo '::error::The release exists, but main was not updated. Inspect the failure and rerun with the same tag and commit.'
            exit 1
          }
          updated=$(git ls-remote origin refs/heads/main)
          [[ "$updated" == "$RELEASE_SHA"* ]] || {
            echo '::error::The release exists, but main does not identify the selected commit. Inspect the failure and rerun with the same tag and commit.'
            exit 1
          }
          {
            printf '## Published source release\n\n'
            printf -- '- Commit: %s\n- Tag: %s\n' "$RELEASE_SHA" "$RELEASE_TAG"
            printf -- '- main now identifies the released commit.\n'
          } >> "$GITHUB_STEP_SUMMARY"

  release-go:
    needs: [validate, verify, publish]
    if: inputs.dry_run == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout the published commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - id: release-go-source
        name: Require the published tag on the validated commit
        run: |
          set -euo pipefail
          # fetch-depth 0 fetched every tag, including the one publish pushed.
          [[ "$(git rev-parse HEAD)" == "$RELEASE_SHA" ]] || {
            echo '::error::The checkout does not identify the released commit.'
            exit 1
          }
          [[ "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" == "$RELEASE_SHA" ]] || {
            echo '::error::The release tag does not identify the released commit; binaries were not published.'
            exit 1
          }
      - id: release-go-tree
        name: Stamp the binaries with the source tree
        run: |
          set -euo pipefail
          # The binaries carry HEAD's tree as their installed revision (decision 34), and only
          # a clean checkout is HEAD's tree.
          [[ -z "$(git status --porcelain)" ]] || {
            echo '::error::The checkout has changes, so the binaries would not be built from its tree.'
            exit 1
          }
          tree=$(git rev-parse 'HEAD^{tree}')
          [[ "$tree" =~ ^[0-9a-f]{40}$ ]] || {
            echo '::error::The checkout names no tree to stamp.'
            exit 1
          }
          echo "SOURCE_TREE=$tree" >> "$GITHUB_ENV"
      - name: Set up the pinned Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - id: release-go-publish
        name: Attach static binaries and SHA256SUMS to the source release
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ inputs.tag }}
        with:
          distribution: goreleaser
          version: v2.18.2
          args: release --clean
