name: CRW CI fixture

on:
  push:

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      - run: go build -tags dev -o "$RUNNER_TEMP/crw-dev" ./cmd/crw-dev
      - run: '"$RUNNER_TEMP/crw-dev" ci validate'
      - run: '"$RUNNER_TEMP/crw-dev" ci plugin'
      - run: '"$RUNNER_TEMP/crw-dev" ci contracts'
      - name: A step the local plan does not have
        run: '"$RUNNER_TEMP/crw-dev" ci something-new'
